name: Render 3D Animated Short

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Fix curl (23) and Fetch 3D Assets
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl
          mkdir -p assets
          sed -i 's/curl -L -s -o/wget -q -O/g; s/curl -sL -o/wget -q -O/g; s/curl -Lo/wget -O/g; s/curl -L -o/wget -O/g' scripts/fetch-assets.sh || true
          bash scripts/fetch-assets.sh

      - name: 3. Install Engine Dependencies
        working-directory: ./engine
        run: npm install

      - name: 4. Install Headless Chrome System Libraries & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 \
            libpango-1.0-0 libcairo2 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 ffmpeg

      - name: 5. Install Chrome Stable
        working-directory: ./engine
        run: |
          CHROME_OUT=$(npx @puppeteer/browsers install chrome@stable)
          CHROME_PATH=$(echo "$CHROME_OUT" | tail -n 1 | awk '{print $2}')
          echo "CHROME_PATH=$CHROME_PATH" >> $GITHUB_ENV

      - name: 6. Create Safety Patch for render.cjs
        working-directory: ./engine
        run: |
          cat << 'EOF' > patch.cjs
          const http = require("http");
          const fs = require("fs");
          const Module = require("module");

          process.on("uncaughtException", (err) => {
            if (err && err.code === "ENOENT") return;
            console.error(err);
            process.exit(1);
          });

          const origStream = fs.createReadStream;
          fs.createReadStream = function(p, opts) {
            const s = origStream.call(this, p, opts);
            s.on("error", () => {});
            return s;
          };

          const origServer = http.createServer;
          http.createServer = function(fn) {
            return origServer.call(this, (req, res) => {
              if (req.url && req.url.includes("favicon.ico")) {
                res.writeHead(404);
                res.end();
                return;
              }
              return fn(req, res);
            });
          };

          const origLoad = Module._load;
          Module._load = function(request) {
            const mod = origLoad.apply(this, arguments);
            if ((request === "puppeteer" || request === "puppeteer-core") && mod) {
              const target = mod.default || mod;
              if (target.launch && !target.__patched) {
                const origLaunch = target.launch;
                target.launch = function(opts = {}) {
                  return origLaunch.call(this, {
                    ...opts,
                    executablePath: process.env.CHROME_PATH || opts.executablePath,
                    args: [...(opts.args || []), "--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
                  });
                };
                target.__patched = true;
              }
            }
            return mod;
          };
          EOF

      - name: 7. Render Video
        working-directory: ./engine
        env:
          XQ: "&viewer=1&skit=1"
          NODE_OPTIONS: "-r ./patch.cjs"
        run: |
          mkdir -p out
          node render.cjs out/skit.mp4 1080 1920 30

      - name: 8. Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-skit-mp4
          path: engine/out/skit.mp4
